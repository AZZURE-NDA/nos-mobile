name: Build Ubuntu runtime

on:
  push:
    paths:
      - 'tools/ubuntu-rootfs/**'
      - '.github/workflows/build-ubuntu-rootfs.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Runtime version written to /.version'
        required: false
        default: 'nos-ubuntu-26.04-r4'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build the arm64 image
        env:
          RUNTIME_VERSION: ${{ inputs.version || 'nos-ubuntu-26.04-r4' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd >/dev/null
          bash tools/ubuntu-rootfs/build.sh "$PWD/out"
      - name: Check the image has KDE and no GNOME
        run: |
          list=$(tar --zstd -tf out/linuxfs-ubuntu.tar.zst)
          for f in usr/bin/startplasma-wayland usr/bin/kwin_wayland usr/bin/konsole usr/lib/aarch64-linux-gnu/qt6/plugins/org.kde.kdecoration3/org.kde.kwin.aurorae.so; do
            grep -qxF -e "./$f" -e "$f" <<<"$list" || { echo "missing: $f"; exit 1; }
          done
          if grep -qxF -e "./usr/bin/gnome-shell" -e "usr/bin/gnome-shell" <<<"$list"; then echo "gnome-shell is in the image"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: linuxfs-ubuntu
          retention-days: 14
          compression-level: 0
          path: out/
